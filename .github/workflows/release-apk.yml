name: Release APK
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the APK to, such as v7.0.0-beta.0
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.TAG }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Prebuild expo app for Android
        run: |
          yarn example expo prebuild --platform android

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Gradle directly rather than the example's build:android:apk script, so older tags without the script still build.
      - name: Build release APK
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        working-directory: example/android
        run: |
          ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="blur-example-${TAG}.apk"
          cp example/android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
